<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUSINÚ · Peticiones, quejas y reclamos</title>
<style>
  :root {
    --dorado: #EDC92A;
    --amarillo: #FEE72B;
    --azul-noche: #051469;
    --azul: #013996;
    --azul-claro: #0A6EDC;
    --blanco: #FFFFFF;
    --negro: #000000;
    --borde: #0A6EDC;
    --fondo: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {  display: flex; flex-direction: column; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--negro); background: var(--fondo); line-height: 1.45; }
  header { display: flex; flex-direction: column; background: var(--dorado); color: var(--blanco); padding: 20px 16px; border-bottom: 4px solid var(--amarillo); }
  header h1 { margin: 0; font-size: 1.25rem; text-align: center; color: #051469 }
  header p { margin: 10px 0 0; color: var(--azul-noche); font-size: .95rem; text-align: center; font-style: italic}
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  form, .resultado { background: var(--blanco); border: 4px solid var(--amarillo); border-top: 4px solid var(--azul); border-radius: 10px; padding: 16px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; color: var(--azul-noche); }
  .ayuda { font-weight: 400; color: var(--azul); font-size: .9rem; }
  select, input, textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--borde); border-radius: 8px; background: var(--blanco); color: var(--negro); }
  select:focus, input:focus, textarea:focus { outline: 3px solid var(--amarillo); outline-offset: 1px; border-color: var(--azul); }
  textarea { min-height: 140px; resize: vertical; }
  fieldset { border: 1px dashed var(--azul-claro); border-radius: 8px; margin: 18px 0 0; padding: 4px 12px 12px; }
  legend { padding: 0 6px; color: var(--azul); font-size: .95rem; font-weight: 600; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-weight: 400; color: var(--negro); }
  .check input { width: auto; margin-top: 4px; accent-color: var(--azul); }
  .trampa { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  button { margin-top: 20px; width: 100%; padding: 14px; font: inherit; font-weight: 700; color: var(--blanco); background: var(--azul-noche); border: 0; border-bottom: 3px solid var(--dorado); border-radius: 8px; cursor: pointer; }
  button:hover { background: var(--azul); }
  button:focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }
  button[disabled] { opacity: .6; cursor: wait; }
  .mensaje { margin-top: 14px; padding: 12px; border-radius: 8px; display: none; }
  .mensaje.error { display: block; background: var(--amarillo); color: var(--azul-noche); border-left: 5px solid var(--dorado); font-weight: 600; }
  .resultado { display: none; text-align: center; }
  .resultado h2 { color: var(--azul); margin-top: 0; }
  .radicado { font-size: 1.4rem; font-weight: 800; letter-spacing: .5px; padding: 12px; color: var(--azul-noche); background: var(--amarillo); border: 2px solid var(--dorado); border-radius: 8px; margin: 12px 0; }
  footer { text-align: center; color: var(--azul); font-size: .85rem; padding: 20px 16px; border-top: 1px solid var(--azul-claro); }
</style>
</head>
<body>
<header>
    <img alt="businu" src="bg_yellow_businu.png" style="height: 40px; width: 200px; align-self: center; "></img>
  <p><b>Peticiones, quejas, reclamos, sugerencias y felicitaciones</b></p>
</header>
<main>
  <form id="formulario" novalidate>
    <label for="tipo">¿Qué desea enviar?</label>
    <select id="tipo" name="tipo" required>
      <option value="">Seleccione…</option>
      <option value="PETICION">Petición</option>
      <option value="QUEJA">Queja</option>
      <option value="RECLAMO">Reclamo</option>
      <option value="SUGERENCIA">Sugerencia</option>
      <option value="FELICITACION">Felicitación</option>
    </select>

    <label for="descripcion">Cuéntenos qué pasó <span class="ayuda">(mínimo 10 caracteres)</span></label>
    <textarea id="descripcion" name="descripcion" maxlength="3000" required></textarea>

    <label for="embarcadero">Embarcadero <span class="ayuda">(opcional)</span></label>
    <select id="embarcadero" name="embarcadero">
      <option value="">No aplica / no recuerdo</option>
      <option value="RANCHO_GRANDE">Rancho Grande</option>
      <option value="CENTRO_CALLE_22">Centro – Calle 22</option>
      <option value="CENTRO_VERDE">Centro Verde</option>
    </select>

    <label for="fechaHecho">Fecha en que ocurrió <span class="ayuda">(opcional)</span></label>
    <input id="fechaHecho" name="fechaHecho" type="date">

    <fieldset>
      <legend>Datos de contacto (opcionales, para responderle)</legend>
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" maxlength="150" autocomplete="name">
      <label for="correo">Correo electrónico</label>
      <input id="correo" name="correo" type="email" maxlength="150" autocomplete="email">
      <label for="telefono">Teléfono</label>
      <input id="telefono" name="telefono" type="tel" maxlength="30" autocomplete="tel">
      <label class="check">
        <input id="autorizaDatos" name="autorizaDatos" type="checkbox">
        <span>Autorizo el tratamiento de mis datos personales únicamente para dar respuesta a esta solicitud,
          de acuerdo con la Ley 1581 de 2012.</span>
      </label>
    </fieldset>

    <!-- Campo trampa contra envíos automáticos: las personas no lo ven -->
    <div class="trampa" aria-hidden="true">
      <label for="sitioWeb">No llene este campo</label>
      <input id="sitioWeb" name="sitioWeb" tabindex="-1" autocomplete="off">
    </div>

    <button id="enviar" type="submit">Enviar</button>
    <div id="mensaje" class="mensaje" role="alert"></div>
  </form>

  <section id="resultado" class="resultado" aria-live="polite">
    <h2>¡Recibimos su solicitud!</h2>
    <p>Su número de radicado es:</p>
    <div id="radicado" class="radicado"></div>
    <p>Guárdelo: con este número puede preguntar por su solicitud en cualquier taquilla.</p>
  </section>
</main>
<footer>Sistema BUSINÚ · Operación piloto en el río Sinú</footer>

<script>
  const form = document.getElementById('formulario');
  const mensaje = document.getElementById('mensaje');
  const boton = document.getElementById('enviar');
  document.getElementById('fechaHecho').max = new Date().toISOString().slice(0, 10);

  function error(texto) { mensaje.textContent = texto; mensaje.className = 'mensaje error'; }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    mensaje.className = 'mensaje';
    const v = (id) => document.getElementById(id).value.trim();
    const datos = {
      tipo: v('tipo'), descripcion: v('descripcion'), embarcadero: v('embarcadero') || null,
      fechaHecho: v('fechaHecho') || null, nombre: v('nombre') || null, correo: v('correo') || null,
      telefono: v('telefono') || null, autorizaDatos: document.getElementById('autorizaDatos').checked,
      sitioWeb: v('sitioWeb')
    };
    if (!datos.tipo) return error('Seleccione qué desea enviar.');
    if (datos.descripcion.length < 10) return error('Cuéntenos un poco más (mínimo 10 caracteres).');
    if ((datos.nombre || datos.correo || datos.telefono) && !datos.autorizaDatos)
      return error('Para dejar sus datos de contacto debe autorizar su tratamiento.');

    boton.disabled = true; boton.textContent = 'Enviando…';
    try {
      const r = await fetch('/pqrs/radicar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
      const cuerpo = await r.json().catch(() => ({}));
      if (r.ok) {
        document.getElementById('radicado').textContent = cuerpo.radicado;
        form.style.display = 'none';
        document.getElementById('resultado').style.display = 'block';
      } else if (r.status === 429) {
        error('Ha enviado varias solicitudes seguidas. Intente de nuevo en un rato.');
      } else {
        const detalle = cuerpo.errors ? Object.values(cuerpo.errors).join(' ') : (cuerpo.detail || '');
        error('No se pudo enviar. ' + detalle);
      }
    } catch (_) {
      error('No hay conexión. Intente de nuevo.');
    } finally {
      boton.disabled = false; boton.textContent = 'Enviar';
    }
  });
</script>
</body>
</html>
