spring.application.name=api
spring.datasource.url=jdbc:postgresql://localhost:5432/businu
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

server.port=3000

# Clave HMAC de al menos 32 caracteres. En producción, por variable de entorno (Secrets Manager).
security.secret-key=${JWT_SECRET:cambia-esta-clave-de-desarrollo-de-32-caracteres-o-mas}
security.access-token-minutes=480

# AWS
aws.region=us-east-2
aws.s3.bucket=${AWS_S3_BUCKET:aws-s3-businu}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB