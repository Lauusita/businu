spring.application.name=api

# Base de datos (valores por defecto para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/businu}
spring.datasource.username=${DB_USER:businu}
spring.datasource.password=${DB_PASSWORD:businu}

# El esquema lo manda Flyway; Hibernate solo verifica que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
