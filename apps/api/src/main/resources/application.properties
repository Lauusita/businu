spring.application.name=api

spring.jpa.open-in-view=false

server.port=3000

security.access-token-minutes=480

# AWS
aws.region=us-east-2

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Perfil activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Horario
operacion.zona=America/Bogota
operacion.hora-inicio=05:00
operacion.hora-fin=21:00
# Decisión de negocio: la embarcación puede operar de lunes a domingo (el anexo §7.1.1 indica L-V)
operacion.dias=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY,SUNDAY
operacion.tolerancia-cierre=120m


# Correo (R50: constancia de comunicación de fallas). El servidor SMTP se configura con variables de
# entorno: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
# Sin SPRING_MAIL_HOST no se envía nada: la constancia queda FALLIDO y se puede reintentar.
businu.correo.remitente=${CORREO_REMITENTE:no-reply@businu.local}
businu.correo.supervisor=${CORREO_SUPERVISOR:}
# Amazon SES (SMTP): puerto 587 con STARTTLS y usuario/contraseña SMTP de SES. El remitente
# (CORREO_REMITENTE) debe ser una identidad verificada en SES.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Auditoría (R5): historial de cambios con Envers. Tablas *_aud + revisiones (autor y fecha).
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
