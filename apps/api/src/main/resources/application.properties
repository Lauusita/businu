spring.application.name=api
spring.datasource.url=jdbc:postgresql://localhost:5432/businu
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

server.port=3000

# Clave HMAC de al menos 32 caracteres. En producción, por variable de entorno (Secrets Manager).
security.secret-key=${JWT_SECRET:cambia-esta-clave-de-desarrollo-de-32-caracteres-o-mas}
# 8 horas = un turno de operación
security.access-token-minutes=480