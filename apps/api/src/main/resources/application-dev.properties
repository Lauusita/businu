# Base de datos local
spring.datasource.url=jdbc:postgresql://localhost:5432/businu
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate: el esquema lo crea Flyway (db/migration); Hibernate solo valida que coincida con las entidades.
# Un cambio en las entidades necesita una migración nueva (V2__...).
spring.jpa.hibernate.ddl-auto=validate

# Clave HMAC de desarrollo
security.secret-key=${JWT_SECRET:cambia-esta-clave-de-desarrollo-de-32-caracteres-o-mas}

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET:aws-s3-businu}