spring:
  application:
    name: businu-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/businu}
    username: ${DB_USER:businu}
    password: ${DB_PASSWORD:businu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo manda Flyway; Hibernate solo verifica que coincida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
