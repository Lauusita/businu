name: CI API

on:
  pull_request:
    branches: [ "dev", "main" ]
    paths: [ "apps/api/**", ".github/workflows/ci-api.yml" ]
  push:
    branches: [ "dev" ]
    paths: [ "apps/api/**" ]

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true          # si subes otro commit, cancela la ejecución anterior

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: businu
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:                            # valores falsos: la prueba no sube archivos ni envía correos
      AWS_S3_BUCKET: ci-dummy
      SPRING_MAIL_USERNAME: ci
      SPRING_MAIL_PASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4     

      - name: Compilar y correr pruebas
        run: chmod +x gradlew && ./gradlew --no-daemon build

      - name: Construir la imagen Docker (sin publicarla)
        run: docker build -t businu-api:ci .

  dependency-submission:
    name: Enviar dependencias a GitHub
    runs-on: ubuntu-latest
    if: github.event_name == 'push'     
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: apps/api
